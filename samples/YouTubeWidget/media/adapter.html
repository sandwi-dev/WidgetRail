<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>YouTube player adapter</title>
<style>
html,body,#player{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
iframe{width:100%;height:100%;display:block;border:0}
</style>
<div id="player" aria-label="YouTube video player"></div>
<script src="adapter-runtime.js"></script>
<script>
const apiDeadlineMs = 12000;
let player = null;
let adapter = null;
let apiFailure = null;
let mediaKey = "";
let playbackState = "ready";
let loopCurrentVideo = false;
let lastProgressSecond = -1;
let pendingProviderOperation = null;
let resolveApi;
let rejectApi;

const apiReady = new Promise((resolve, reject) => {
  resolveApi = resolve;
  rejectApi = reject;
});
const apiTimer = setTimeout(
  () => failApi("player-api-load-failed"), apiDeadlineMs);

function bounds() {
  return {
    x: 0,
    y: 0,
    width: document.documentElement.clientWidth,
    height: document.documentElement.clientHeight,
  };
}

function playerError(code) {
  if (code === 2) return "invalid-video";
  if (code === 5) return "playback-unavailable";
  if (code === 100) return "video-private-or-missing";
  if (code === 101 || code === 150) return "embedding-disabled";
  if (code === 153) return "client-identity-rejected";
  return "player-error";
}

function stateName(value) {
  if (value === 1) return "playing";
  if (value === 2) return "paused";
  if (value === 3) return "loading";
  if (value === 0) return "ended";
  return "ready";
}

function position() {
  const value = Number(player?.getCurrentTime?.());
  return Number.isFinite(value) ? Math.max(0, value) : 0;
}

function duration() {
  const value = Number(player?.getDuration?.());
  return Number.isFinite(value) ? Math.max(0, value) : 0;
}

function volume() {
  const value = Number(player?.getVolume?.());
  return Number.isFinite(value)
    ? Math.max(0, Math.min(1, value / 100))
    : 0.8;
}

function playbackRate() {
  const value = Number(player?.getPlaybackRate?.());
  return Number.isFinite(value) ? Math.max(0.5, Math.min(2, value)) : 1;
}

function muted() {
  return player?.isMuted?.() === true;
}

function currentPlayerVideoId() {
  const value = player?.getVideoData?.()?.video_id;
  return typeof value === "string" ? value : "";
}

function snapshot() {
  return {
    mediaKey,
    playbackState,
    positionSeconds: position(),
    durationSeconds: duration(),
    volume: volume(),
    playbackRate: playbackRate(),
    muted: muted(),
    loop: loopCurrentVideo,
  };
}

function failApi(code) {
  if (apiFailure) return;
  apiFailure = code;
  clearTimeout(apiTimer);
  rejectApi(WidgetRailEmbeddedMediaAdapter.error(code));
}

function clearPendingProvider(error) {
  const pending = pendingProviderOperation;
  pendingProviderOperation = null;
  pending?.cleanup?.();
  if (pending && error) pending.reject(error);
}

async function readyFor(command) {
  await apiReady;
  if (command.signal.aborted) {
    throw WidgetRailEmbeddedMediaAdapter.error("authority-replaced");
  }
}

function waitForState(
  expectedStates, start, admitCurrentState, signal) {
  if (pendingProviderOperation) {
    return Promise.reject(
      WidgetRailEmbeddedMediaAdapter.error("player-operation-overlap"));
  }
  return new Promise((resolve, reject) => {
    const cancel = () => {
      if (pendingProviderOperation !== pending) return;
      pendingProviderOperation = null;
      pending.cleanup();
      reject(WidgetRailEmbeddedMediaAdapter.error("authority-replaced"));
    };
    const pending = {
      expectedStates: new Set(expectedStates),
      resolve,
      reject,
      cleanup: () => signal.removeEventListener("abort", cancel),
    };
    pendingProviderOperation = pending;
    signal.addEventListener("abort", cancel, { once: true });
    if (signal.aborted) {
      cancel();
      return;
    }
    try {
      start?.();
      const current = player?.getPlayerState?.();
      if (admitCurrentState && pending.expectedStates.has(current)) {
        pendingProviderOperation = null;
        pending.cleanup();
        playbackState = stateName(current);
        resolve({ playbackState });
      }
    } catch (error) {
      if (pendingProviderOperation === pending) pendingProviderOperation = null;
      pending.cleanup();
      reject(error);
    }
  });
}

function completeAfterDelay(start, signal) {
  if (pendingProviderOperation) {
    return Promise.reject(
      WidgetRailEmbeddedMediaAdapter.error("player-operation-overlap"));
  }
  return new Promise((resolve, reject) => {
    const cancel = () => {
      if (pendingProviderOperation !== pending) return;
      pendingProviderOperation = null;
      pending.cleanup();
      reject(WidgetRailEmbeddedMediaAdapter.error("authority-replaced"));
    };
    const pending = {
      expectedStates: null,
      resolve,
      reject,
      cleanup: () => signal.removeEventListener("abort", cancel),
    };
    pendingProviderOperation = pending;
    signal.addEventListener("abort", cancel, { once: true });
    if (signal.aborted) {
      cancel();
      return;
    }
    try {
      start();
      setTimeout(() => {
        if (pendingProviderOperation !== pending) return;
        pendingProviderOperation = null;
        pending.cleanup();
        playbackState = stateName(player.getPlayerState());
        resolve({ playbackState });
      }, 100);
    } catch (error) {
      if (pendingProviderOperation === pending) pendingProviderOperation = null;
      pending.cleanup();
      reject(error);
    }
  });
}

function waitForPlaybackRate(command) {
  if (pendingProviderOperation) {
    return Promise.reject(
      WidgetRailEmbeddedMediaAdapter.error("player-operation-overlap"));
  }
  return new Promise((resolve, reject) => {
    let timeout = 0;
    const cancel = () => {
      if (pendingProviderOperation !== pending) return;
      pendingProviderOperation = null;
      pending.cleanup();
      reject(WidgetRailEmbeddedMediaAdapter.error("authority-replaced"));
    };
    const expire = () => {
      if (pendingProviderOperation !== pending) return;
      pendingProviderOperation = null;
      pending.cleanup();
      reject(WidgetRailEmbeddedMediaAdapter.error("player-operation-timeout"));
    };
    const pending = {
      expectedStates: null,
      expectedPlaybackRate: command.playbackRate,
      mediaKey: command.mediaKey,
      commandSequence: command.sequence,
      resolve,
      reject,
      cleanup: () => {
        clearTimeout(timeout);
        command.signal.removeEventListener("abort", cancel);
      },
    };
    pendingProviderOperation = pending;
    command.signal.addEventListener("abort", cancel, { once: true });
    if (command.signal.aborted) {
      cancel();
      return;
    }
    try {
      timeout = setTimeout(expire, 1500);
      player.setPlaybackRate(command.playbackRate);
    } catch (error) {
      if (pendingProviderOperation === pending) pendingProviderOperation = null;
      pending.cleanup();
      reject(error);
    }
  });
}

function onReady() {
  clearTimeout(apiTimer);
  resolveApi(player);
}

function onStateChange(event) {
  playbackState = stateName(event.data);
  const pending = pendingProviderOperation;
  if (pending?.expectedStates?.has(event.data)) {
    pendingProviderOperation = null;
    pending.cleanup();
    pending.resolve({ playbackState });
    return;
  }
  if (event.data === 0 && loopCurrentVideo && mediaKey) {
    playbackState = "loading";
    player.seekTo(0, true);
    player.playVideo();
    adapter?.observe();
    return;
  }
  adapter?.observe();
}

function onPlaybackRateChange(event) {
  const pending = pendingProviderOperation;
  const reportedRate = Number(event.data);
  if (!pending || !Number.isFinite(pending.expectedPlaybackRate)) {
    adapter?.observe();
    return;
  }
  if (pending.commandSequence <= 0 || pending.mediaKey !== mediaKey) return;
  const playerVideoId = currentPlayerVideoId();
  if (playerVideoId && playerVideoId !== pending.mediaKey) return;
  if (!Number.isFinite(reportedRate) ||
      Math.abs(reportedRate - pending.expectedPlaybackRate) >= 0.001 ||
      Math.abs(playbackRate() - pending.expectedPlaybackRate) >= 0.001) return;
  pendingProviderOperation = null;
  pending.cleanup();
  pending.resolve({ playbackState: stateName(player.getPlayerState()) });
}

function onError(event) {
  playbackState = "error";
  const error = WidgetRailEmbeddedMediaAdapter.error(
    playerError(Number(event.data)));
  const pending = pendingProviderOperation;
  if (pending) {
    pendingProviderOperation = null;
    pending.cleanup();
    pending.reject(error);
    return;
  }
  adapter?.observeError(error.adapterCode);
}

window.onYouTubeIframeAPIReady = () => {
  try {
    player = new YT.Player("player", {
      width: "100%",
      height: "100%",
      playerVars: {
        autoplay: 0,
        controls: 0,
        disablekb: 1,
        enablejsapi: 1,
        fs: 0,
        playsinline: 1,
        origin: location.origin,
        rel: 0,
      },
      events: { onReady, onStateChange, onPlaybackRateChange, onError },
    });
  } catch {
    failApi("player-api-load-failed");
  }
};

const script = document.createElement("script");
script.src = "https://www.youtube.com/iframe_api";
script.async = true;
script.onerror = () => failApi("player-api-load-failed");
document.head.appendChild(script);

adapter = WidgetRailEmbeddedMediaAdapter.create({
  focus: "youtube-player",
  bounds,
  snapshot,
  errorCode(error) {
    return apiFailure || error?.adapterCode || error?.message || "player-error";
  },
  driver: {
    initialize() {
      clearPendingProvider(
        WidgetRailEmbeddedMediaAdapter.error("authority-replaced"));
    },
    async load(command) {
      await readyFor(command);
      mediaKey = command.mediaKey;
      playbackState = "loading";
      return waitForState([5], () => player.cueVideoById({
        videoId: mediaKey,
        startSeconds: 0,
      }), false, command.signal);
    },
    async cue(command) {
      await readyFor(command);
      mediaKey = command.mediaKey;
      playbackState = "loading";
      return waitForState([5], () => player.cueVideoById({
        videoId: mediaKey,
        startSeconds: 0,
      }), false, command.signal);
    },
    async activate(command) {
      await readyFor(command);
      return {
        completion: waitForState(
          [1], undefined, false, command.signal),
      };
    },
    async pause(command) {
      await readyFor(command);
      return waitForState(
        [2], () => player.pauseVideo(), true, command.signal);
    },
    async toggle(command) {
      await readyFor(command);
      if (player.getPlayerState() === 1) {
        return waitForState(
          [2], () => player.pauseVideo(), true, command.signal);
      }
      return waitForState(
        [1], () => player.playVideo(), true, command.signal);
    },
    async seek(command) {
      await readyFor(command);
      return completeAfterDelay(() => player.seekTo(
        Math.max(0, command.positionSeconds), true), command.signal);
    },
    async seekBackward(command) {
      await readyFor(command);
      const target = Math.max(0, Math.min(
        duration(), position() - 10));
      return completeAfterDelay(
        () => player.seekTo(target, true), command.signal);
    },
    async seekForward(command) {
      await readyFor(command);
      const target = Math.max(0, Math.min(
        duration(), position() + 10));
      return completeAfterDelay(
        () => player.seekTo(target, true), command.signal);
    },
    async setVolume(command) {
      await readyFor(command);
      player.setVolume(Math.round(command.volume * 100));
      return { playbackState: stateName(player.getPlayerState()) };
    },
    async setPlaybackRate(command) {
      await readyFor(command);
      const available = player.getAvailablePlaybackRates()
        .map(Number)
        .filter(Number.isFinite);
      if (!available.some(rate => Math.abs(rate - command.playbackRate) < 0.001)) {
        throw WidgetRailEmbeddedMediaAdapter.error("command-unsupported");
      }
      return waitForPlaybackRate(command);
    },
    async setMuted(command) {
      await readyFor(command);
      if (command.muted) player.mute();
      else player.unMute();
      return { playbackState: stateName(player.getPlayerState()) };
    },
    async setLoop(command) {
      await readyFor(command);
      loopCurrentVideo = command.loop === true;
      player.setLoop(loopCurrentVideo);
      return { playbackState: stateName(player.getPlayerState()) };
    },
  },
});

setInterval(() => {
  if (playbackState !== "playing") return;
  const second = Math.floor(position());
  if (second !== lastProgressSecond && adapter.observe()) {
    lastProgressSecond = second;
  }
}, 500);
</script>
