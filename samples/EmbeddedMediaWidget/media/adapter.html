<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Local media plane</title><style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090b12}#plane{width:100%;height:100%;display:block;background:radial-gradient(circle at 50% 45%,#6c67d8 0,#242858 28%,#101426 62%,#090b12 100%)}body.playing #plane{animation:pulse 1.8s ease-in-out infinite alternate}@keyframes pulse{to{filter:hue-rotate(24deg) brightness(1.16)}}</style><canvas id="plane" aria-hidden="true"></canvas><audio id="media"></audio><script>
const plane=document.querySelector('#plane'),media=document.querySelector('#media');let authority={},sequence=0,spatial=null,commandPending=false,mediaKey='aurora-tone-0',scene=0,lastTick=-1;
function tone(){const rate=8000,count=rate*60,data=count*2,b=new ArrayBuffer(44+data),v=new DataView(b),s=(o,t)=>[...t].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));s(0,'RIFF');v.setUint32(4,36+data,true);s(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,data,true);for(let i=0;i<count;i++)v.setInt16(44+i*2,Math.sin(i/(18+scene))*4200,true);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
let mediaUrl=tone();media.src=mediaUrl;
function bounds(){return{x:0,y:0,width:document.documentElement.clientWidth,height:document.documentElement.clientHeight}}
function state(){return media.error?'error':!media.paused?'playing':media.currentTime>0?'paused':'ready'}
function emit(type,id=0,commandSequence=0,errorCode){const value={type,...authority,eventSequence:++sequence,commandId:id,focus:'media-plane',playing:!media.paused,bounds:bounds(),mediaKey,playbackState:state(),positionSeconds:Number.isFinite(media.currentTime)?media.currentTime:0,durationSeconds:Number.isFinite(media.duration)?media.duration:60,volume:media.volume};if(errorCode)value.errorCode=errorCode;chrome.webview.postMessage(value)}
function applyMediaKey(key){if(key===mediaKey)return;mediaKey=key;scene=[...key].reduce((n,c)=>(n+c.charCodeAt(0))%8,0);URL.revokeObjectURL(mediaUrl);mediaUrl=tone();media.src=mediaUrl;plane.style.filter=`hue-rotate(${scene*32}deg)`}
async function play(id,commandSequence){await media.play();document.body.classList.add('playing');emit('media',id,commandSequence)}
function pause(id,commandSequence){media.pause();document.body.classList.remove('playing');emit('media',id,commandSequence)}
plane.onclick=()=>{const pending=spatial;spatial=null;if(pending){commandPending=true;void play(pending.id,pending.sequence).finally(()=>commandPending=false)}};
media.addEventListener('timeupdate',()=>{const tick=Math.floor(media.currentTime);if(!commandPending&&!spatial&&tick!==lastTick){lastTick=tick;emit('media')}});media.addEventListener('ended',()=>{if(!commandPending)emit('media')});
chrome.webview.addEventListener('message',async e=>{const m=e.data;if(!m)return;if(m.command==='initialize'){authority={environmentGeneration:m.environmentGeneration,surfaceGeneration:m.surfaceGeneration,sessionGeneration:m.sessionGeneration,controllerGeneration:m.controllerGeneration,documentGeneration:m.documentGeneration};sequence=0;emit('ready',m.commandId);return}for(const k of Object.keys(authority))if(m[k]!==authority[k])return;const cs=m.commandSequence||0;if(m.mediaKey)applyMediaKey(m.mediaKey);if(m.command==='arm-activate'){spatial={id:m.commandId,sequence:cs};emit('armed',m.commandId,cs);return}commandPending=true;try{if(m.command==='load'||m.command==='cue'){media.currentTime=0;emit('media',m.commandId,cs)}else if(m.command==='pause')pause(m.commandId,cs);else if(m.command==='seek'){media.currentTime=Math.max(0,Math.min(media.duration||60,m.positionSeconds||0));emit('media',m.commandId,cs)}else if(m.command==='volume'){media.volume=Math.max(0,Math.min(1,m.volume));emit('media',m.commandId,cs)}else if(m.command==='toggle'){if(media.paused)await play(m.commandId,cs);else pause(m.commandId,cs)}else if(m.command==='seek-back'){media.currentTime=Math.max(0,media.currentTime-10);emit('media',m.commandId,cs)}else if(m.command==='seek-forward'){media.currentTime=Math.min(media.duration||60,media.currentTime+10);emit('media',m.commandId,cs)}else if(m.command==='previous'||m.command==='next'){scene+=(m.command==='next'?1:-1);plane.style.filter=`hue-rotate(${scene*32}deg)`;emit('media',m.commandId,cs)}}finally{commandPending=false}});
</script>
