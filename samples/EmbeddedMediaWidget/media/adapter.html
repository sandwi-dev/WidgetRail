<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Local media plane</title><style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090b12}#plane{width:100%;height:100%;display:block;background:radial-gradient(circle at 50% 45%,#6c67d8 0,#242858 28%,#101426 62%,#090b12 100%)}body.playing #plane{animation:pulse 1.8s ease-in-out infinite alternate}@keyframes pulse{to{filter:hue-rotate(24deg) brightness(1.16)}}</style><canvas id="plane" aria-hidden="true"></canvas><audio id="media" loop></audio><script>
const plane=document.querySelector('#plane'),media=document.querySelector('#media');let authority={},sequence=0,spatial=0,scene=0;function tone(){const rate=8000,count=8000,data=count*2,b=new ArrayBuffer(44+data),v=new DataView(b),s=(o,t)=>[...t].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));s(0,'RIFF');v.setUint32(4,36+data,true);s(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,data,true);for(let i=0;i<count;i++)v.setInt16(44+i*2,Math.sin(i/18)*4500,true);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}media.src=tone();function bounds(){return{x:0,y:0,width:document.documentElement.clientWidth,height:document.documentElement.clientHeight}}function emit(type,id=0){chrome.webview.postMessage({type,...authority,eventSequence:++sequence,commandId:id,focus:'media-plane',playing:!media.paused,bounds:bounds()})}async function toggle(id){if(media.paused)await media.play();else media.pause();document.body.classList.toggle('playing',!media.paused);emit('media',id)}plane.onclick=()=>{const id=spatial;spatial=0;void toggle(id)};chrome.webview.addEventListener('message',async e=>{const m=e.data;if(!m)return;if(m.command==='initialize'){authority={environmentGeneration:m.environmentGeneration,surfaceGeneration:m.surfaceGeneration,sessionGeneration:m.sessionGeneration,controllerGeneration:m.controllerGeneration,documentGeneration:m.documentGeneration};sequence=0;emit('ready',m.commandId);return}for(const k of Object.keys(authority))if(m[k]!==authority[k])return;if(m.command==='arm-activate'){spatial=m.commandId;emit('armed',m.commandId);return}if(m.command==='toggle')await toggle(m.commandId);else if(m.command==='seek-back'){media.currentTime=Math.max(0,media.currentTime-10);emit('media',m.commandId)}else if(m.command==='seek-forward'){media.currentTime=Math.min(media.duration||60,media.currentTime+10);emit('media',m.commandId)}else if(m.command==='previous'||m.command==='next'){scene+=(m.command==='next'?1:-1);plane.style.filter=`hue-rotate(${scene*32}deg)`;emit('media',m.commandId)}});
</script>
