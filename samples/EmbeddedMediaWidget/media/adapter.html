<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Local media plane</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090b12}
#media{width:100%;height:100%;display:block;object-fit:cover;background:#090b12}
</style>
<video id="media" playsinline preload="auto"></video>
<script>
const media=document.querySelector('#media');
const sources=new Map([
  ['aurora-video-0','sample.mp4'],
  ['horizon-video-1','horizon.mp4'],
]);
let authority={},sequence=0,inFlight=null,mediaKey='aurora-video-0',lastTick=-1;
media.loop=true;media.muted=false;media.volume=.8;media.src=sources.get(mediaKey);media.load();
function bounds(){return{x:0,y:0,width:document.documentElement.clientWidth,height:document.documentElement.clientHeight}}
function state(){return media.error?'error':!media.paused?'playing':media.currentTime>0?'paused':'ready'}
function emit(type,id=0,commandSequence=0,errorCode,forcedState,observedMediaKey=mediaKey){const failed=!!errorCode,playbackState=failed?'error':forcedState||state(),value={type,...authority,eventSequence:++sequence,commandId:id,focus:'media-plane',playing:playbackState==='playing',bounds:bounds(),mediaKey:observedMediaKey,playbackState,positionSeconds:Number.isFinite(media.currentTime)?media.currentTime:0,durationSeconds:Number.isFinite(media.duration)?media.duration:60,volume:media.volume};if(errorCode)value.errorCode=errorCode;chrome.webview.postMessage(value)}
function loadMedia(key){const source=sources.get(key);if(!source)return Promise.reject(new DOMException('media-key-unsupported','NotSupportedError'));media.pause();mediaKey=key;lastTick=-1;return new Promise((resolve,reject)=>{let settled=false;const cleanup=()=>{media.removeEventListener('loadedmetadata',ready);media.removeEventListener('error',failed);media.removeEventListener('abort',failed)},finish=callback=>{if(settled)return;settled=true;cleanup();callback()},ready=()=>finish(resolve),failed=()=>finish(()=>reject(new DOMException('media-load-failed','AbortError')));media.addEventListener('loadedmetadata',ready,{once:true});media.addEventListener('error',failed,{once:true});media.addEventListener('abort',failed,{once:true});media.src=source;media.load();if(media.readyState>=1)ready()})}
function seekTo(position){const element=media,source=element.currentSrc||element.src,target=Math.max(0,Math.min(element.duration||20,position));return new Promise((resolve,reject)=>{let settled=false;const cleanup=()=>{element.removeEventListener('seeked',complete);element.removeEventListener('error',fail);element.removeEventListener('abort',fail);element.removeEventListener('emptied',fail)},finish=callback=>{if(settled)return;settled=true;cleanup();callback()},complete=()=>finish(()=>((element.currentSrc||element.src)===source?resolve():reject(new DOMException('source-replaced','AbortError')))),fail=()=>finish(()=>reject(new DOMException('seek-failed','AbortError')));element.addEventListener('seeked',complete,{once:true});element.addEventListener('error',fail,{once:true});element.addEventListener('abort',fail,{once:true});element.addEventListener('emptied',fail,{once:true});try{element.currentTime=target;if(!element.seeking&&Math.abs(element.currentTime-target)<=.05)complete()}catch(error){finish(()=>reject(error))}})}
function playbackFailure(error){const code=Number.isInteger(media.error?.code)?media.error.code:0,name=String(error?.name||'error').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,24)||'error';return `playback-failed-media-${code}-${name}`}
function finish(operation,errorCode,forcedState){if(inFlight!==operation)return;lastTick=Number.isFinite(media.currentTime)?Math.floor(media.currentTime):-1;emit('media',operation.id,operation.sequence,errorCode,forcedState,operation.mediaKey);inFlight=null}
async function play(operation){try{media.muted=false;if(media.volume<=0)media.volume=.8;await media.play();if(media.paused||media.muted||media.volume<=0)throw new Error('inactive');finish(operation,undefined,'playing')}catch(error){media.pause();finish(operation,playbackFailure(error))}}
function pause(){media.pause()}
media.onclick=()=>{const operation=inFlight;if(operation?.phase==='armed'){operation.phase='media';void play(operation)}};
media.addEventListener('timeupdate',()=>{const tick=Math.floor(media.currentTime);if(!inFlight&&tick!==lastTick){lastTick=tick;emit('media')}});
media.addEventListener('ended',()=>{if(!inFlight)emit('media')});
chrome.webview.addEventListener('message',async e=>{const m=e.data;if(!m)return;if(m.command==='initialize'){authority={environmentGeneration:m.environmentGeneration,surfaceGeneration:m.surfaceGeneration,sessionGeneration:m.sessionGeneration,controllerGeneration:m.controllerGeneration,documentGeneration:m.documentGeneration};sequence=0;inFlight=null;emit('ready',m.commandId);return}for(const k of Object.keys(authority))if(m[k]!==authority[k])return;if(inFlight)return;const operation={id:m.commandId,sequence:m.commandSequence||0,mediaKey:m.mediaKey||mediaKey,phase:'media'};inFlight=operation;if(m.command==='arm-activate'){if(operation.mediaKey!==mediaKey){finish(operation,'media-key-mismatch');return}operation.phase='armed';emit('armed',operation.id,operation.sequence,undefined,undefined,operation.mediaKey);return}try{if(m.command==='load'||m.command==='cue'){await loadMedia(operation.mediaKey);finish(operation,undefined,'ready')}else if(operation.mediaKey!==mediaKey)finish(operation,'media-key-mismatch');else if(m.command==='pause'){pause();finish(operation,undefined,'paused')}else if(m.command==='seek'){await seekTo(m.positionSeconds||0);finish(operation)}else if(m.command==='volume'){media.volume=Math.max(0,Math.min(1,m.volume));finish(operation)}else if(m.command==='toggle'){if(media.paused)await play(operation);else{pause();finish(operation,undefined,'paused')}}else if(m.command==='seek-back'){await seekTo(media.currentTime-2);finish(operation)}else if(m.command==='seek-forward'){await seekTo(media.currentTime+2);finish(operation)}else finish(operation,'command-unsupported')}catch(error){finish(operation,playbackFailure(error))}});
</script>
