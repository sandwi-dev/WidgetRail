<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="1024" height="1024">
 <title>WidgetRail — graphite square tile rail study</title>
 <defs>
  <linearGradient id="case" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#08090b"/><stop offset=".55" stop-color="#15181b"/><stop offset="1" stop-color="#292e32"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#96b7aa" stop-opacity=".15"/><stop offset="1" stop-color="#96b7aa" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#e2eee8"/><stop offset=".4" stop-color="#afcabe"/><stop offset="1" stop-color="#4c7068"/></linearGradient>
  <linearGradient id="mint" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#d0e3d9"/><stop offset=".4" stop-color="#a2c6b5"/><stop offset="1" stop-color="#668f82"/></linearGradient>
  <linearGradient id="central" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#e7f1eb"/><stop offset=".35" stop-color="#bdd9ca"/><stop offset="1" stop-color="#7ba997"/></linearGradient>
  <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6eee9" stop-opacity="0"/><stop offset="1" stop-color="#edf4ef" stop-opacity=".38"/></linearGradient>
  <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9e8df"/><stop offset=".22" stop-color="#aac8b8"/><stop offset="1" stop-color="#63887a"/></linearGradient>
  <linearGradient id="highlight"><stop stop-color="#edf4ef" stop-opacity="0"/><stop offset=".25" stop-color="#edf4ef" stop-opacity=".75"/><stop offset=".7" stop-color="#edf4ef" stop-opacity=".4"/><stop offset="1" stop-color="#edf4ef" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-30%" y="-40%" width="160%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="tiles"><rect x="34" y="94" width="50" height="50" rx="11"/><rect x="98" y="84" width="60" height="60" rx="13"/><rect x="172" y="94" width="50" height="50" rx="11"/></clipPath>
 </defs>
 <rect x="2" y="4" width="252" height="252" rx="52" fill="#050607"/>
 <rect x="2" y="1" width="252" height="252" rx="52" fill="url(#case)"/>
 <rect x="2.5" y="1.5" width="251" height="251" rx="51.5" fill="none" stroke="#d3dedb" stroke-opacity=".14"/>
 <ellipse cx="128" cy="126" rx="118" ry="110" fill="url(#aura)"/>
 <g fill="#030606" opacity=".65" filter="url(#shadow)">
  <rect x="32" y="99" width="54" height="54" rx="13"/>
  <rect x="96" y="89" width="64" height="64" rx="15"/>
  <rect x="170" y="99" width="54" height="54" rx="13"/>
  <rect x="28" y="168" width="200" height="22" rx="11"/>
 </g>
 <g fill="url(#edge)">
  <rect x="32" y="92" width="54" height="54" rx="13"/>
  <rect x="96" y="82" width="64" height="64" rx="15"/>
  <rect x="170" y="92" width="54" height="54" rx="13"/>
 </g>
 <rect x="34" y="94" width="50" height="50" rx="11" fill="url(#mint)"/>
 <rect x="98" y="84" width="60" height="60" rx="13" fill="url(#central)"/>
 <rect x="172" y="94" width="50" height="50" rx="11" fill="url(#mint)"/>
 <g clip-path="url(#tiles)">
  <path d="M34 94H84V144Z M98 84H158V144Z M172 94H222V144Z" fill="url(#fold)"/>
 </g>
 <g fill="none" stroke="#ecf4ef" stroke-width="1" stroke-opacity=".65" stroke-linecap="round">
  <path d="M45 93H73"/><path d="M111 83H145"/><path d="M183 93H211"/>
 </g>
 <rect x="28" y="162" width="200" height="22" rx="11" fill="#43655b"/>
 <rect x="28" y="160" width="200" height="22" rx="11" fill="url(#rail)"/>
 <path d="M40 161H216" stroke="url(#highlight)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
