name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope (full is required before integration)
        type: choice
        default: full
        options:
          - full
          - widget-switch

permissions:
  contents: read

jobs:
  managed:
    if: ${{ inputs.scope != 'widget-switch' }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.302
            8.0.x
          cache: true
          cache-dependency-path: |
            global.json
            **/*.csproj
            **/*.props
            **/*.targets
            **/NuGet.Config
      - name: Run bounded managed verification
        shell: pwsh
        run: ./scripts/Verify.ps1 -Configuration Release -Lane managed -OverallTimeoutSeconds 1800
      - name: Retain managed verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-managed
          path: artifacts/verification
          if-no-files-found: warn
          retention-days: 30

  native:
    name: ${{ inputs.scope == 'widget-switch' && 'native-widget-switch-diagnostic' || 'native' }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.302
            8.0.x
          cache: true
          cache-dependency-path: |
            global.json
            **/*.csproj
            **/*.props
            **/*.targets
            **/NuGet.Config
      - name: Install pinned native layout toolchain
        shell: pwsh
        run: |
          $pin = Get-Content src/OverlayHost/taffy_bridge/rust-toolchain.toml -Raw
          if ($pin -notmatch '(?m)^channel = "([0-9.]+)"$') { throw 'Missing Rust toolchain pin' }
          $toolchain = $Matches[1]
          rustup toolchain install $toolchain --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          "RUSTUP_TOOLCHAIN=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run bounded native verification
        shell: pwsh
        env:
          VERIFY_SCOPE: ${{ inputs.scope }}
        run: |
          if ($env:VERIFY_SCOPE -eq 'widget-switch') {
            ./scripts/Verify.ps1 -Configuration Release -StepId overlay-widget-switch-tests -OverallTimeoutSeconds 1800
          } else {
            ./scripts/Verify.ps1 -Configuration Release -Lane native -OverallTimeoutSeconds 1800
          }
      - name: Retain native verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-native
          path: artifacts/verification
          if-no-files-found: warn
          retention-days: 30
