name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
      - name: Run bounded managed verification
        shell: pwsh
        run: ./scripts/Verify.ps1 -Configuration Release -Lane managed -OverallTimeoutSeconds 1800
      - name: Retain managed verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-managed
          path: artifacts/verification
          if-no-files-found: warn
          retention-days: 30

  native:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
      - name: Run bounded native verification
        shell: pwsh
        run: ./scripts/Verify.ps1 -Configuration Release -Lane native -OverallTimeoutSeconds 1800
      - name: Retain native verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-native
          path: artifacts/verification
          if-no-files-found: warn
          retention-days: 30
