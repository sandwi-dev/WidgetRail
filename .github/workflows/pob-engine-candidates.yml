name: PoB engine candidates

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:
    inputs:
      channel:
        description: Upstream channel (configured uses PoE1 stable and PoE2 beta)
        type: choice
        options: [configured, pinned, stable, beta]
        default: configured

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        game: [1, 2]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.302
            8.0.x
      - name: Resolve exact upstream revision
        shell: pwsh
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel || 'configured' }}
          GAME: ${{ matrix.game }}
        run: |
          $channel=$env:REQUESTED_CHANNEL
          if($channel -eq 'configured'){$channel=if($env:GAME -eq '1'){'stable'}else{'beta'}}
          ./samples/PobCompanion/Prepare-EngineCandidate.ps1 -Game $env:GAME -Channel $channel -OutputDirectory artifacts/pob-ci/upstream
      - name: Build pinned Lua runtime
        shell: pwsh
        run: ./samples/PobCompanion/Build-PobRuntime.ps1 -OutputDirectory artifacts/pob-ci/runtime-build
      - name: Prepare artwork dependencies
        shell: pwsh
        run: python -m pip install -r samples/PobCompanion/requirements-artwork.txt
      - name: Validate engine and build candidate only after passing
        shell: pwsh
        env:
          GAME: ${{ matrix.game }}
        run: |
          ./samples/PobCompanion/Test-EngineCandidate.ps1 -Game $env:GAME -EngineCheckout artifacts/pob-ci/upstream/engine -RuntimeDirectory artifacts/pob-ci/runtime-build/runtime -EngineLockPath artifacts/pob-ci/upstream/engine-lock.candidate.json -OutputDirectory artifacts/pob-ci/verification -BuildPackage
      - name: Retain result and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: poe${{ matrix.game }}-engine-evidence
          path: |
            artifacts/pob-ci/upstream/*.json
            artifacts/pob-ci/upstream/*.log
            artifacts/pob-ci/runtime-build/*.log
            artifacts/pob-ci/runtime-build/runtime/provenance.json
            artifacts/pob-ci/verification/*.json
            artifacts/pob-ci/verification/*.log
            artifacts/pob-ci/verification/*.binlog
            artifacts/pob-ci/verification/package/*.binlog
          if-no-files-found: warn
          retention-days: 30
      - name: Retain passing candidate package
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: poe${{ matrix.game }}-engine-candidate
          path: artifacts/pob-ci/verification/package/*.wrwidget
          if-no-files-found: error
          retention-days: 30
